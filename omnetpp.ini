[General]
network = Konvoi
sim-time-limit = 300s
repeat = 10
seed-set = ${repetition}
**.vector-recording = false

**.checksumMode = "computed"
**.fcsMode = "computed"

# Alamat IP & routing
*.configurator.addStaticRoutes = false
**.netmaskRoutes = ""
**.arp.typename = "GlobalArp"

# Radio IEEE 802.11p
*.car[*].wlan[0].opMode = "p"
*.car[*].wlan[0].bitrate = 6Mbps
*.car[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.car[*].wlan[0].radio.bandName = "5.9 GHz"
*.car[*].wlan[0].radio.transmitter.power = 20mW

# Area gerak
*.car[*].mobility.typename = "TurtleMobility"
*.car[*].mobility.constraintAreaMinX = 0m
*.car[*].mobility.constraintAreaMaxX = 15000m
*.car[*].mobility.constraintAreaMinY = 0m
*.car[*].mobility.constraintAreaMaxY = 300m
*.car[*].mobility.constraintAreaMinZ = 0m
*.car[*].mobility.constraintAreaMaxZ = 0m

# Trafik UDP (4 alur)
*.car[0].numApps = 2
*.car[5].numApps = 2
*.car[11].numApps = 2

# penerima (harus DI ATAS baris umum **.app[*])
*.car[0].app[1].typename = "UdpSink"
*.car[11].app[1].typename = "UdpSink"
*.car[0].app[1].localPort = 5000
*.car[11].app[1].localPort = 5000
*.car[0].app[1].startTime = 0s
*.car[11].app[1].startTime = 0s
*.car[0].app[1].stopTime = -1s
*.car[11].app[1].stopTime = -1s

# pengirim
*.car[0].app[0].typename = "UdpBasicApp"
*.car[0].app[0].destAddresses = "car[11]"
*.car[11].app[0].typename = "UdpBasicApp"
*.car[11].app[0].destAddresses = "car[0]"
*.car[5].app[0].typename = "UdpBasicApp"
*.car[5].app[0].destAddresses = "car[0]"
*.car[5].app[1].typename = "UdpBasicApp"
*.car[5].app[1].destAddresses = "car[11]"

# pengaturan umum semua pengirim
**.app[*].destPort = 5000
**.app[*].messageLength = 512B
**.app[*].sendInterval = 0.25s
**.app[*].startTime = uniform(10s, 11s)
**.app[*].stopTime = 290s

# Tampilan Qtenv (tidak memengaruhi hasil)
**.displayCommunicationRanges = true
*.visualizer.dataLinkVisualizer.displayLinks = true

[Config Konvoi]
description = "Konvoi 12 kendaraan, AODV, 40 vs 100 km/jam"

# gerak tiap kendaraan dibaca dari konvoi40.xml atau konvoi100.xml
*.car[0].mobility.turtleScript = xmldoc("konvoi${speed=40,100}.xml", "movements//movement[@id='0']")
*.car[1].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='1']")
*.car[2].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='2']")
*.car[3].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='3']")
*.car[4].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='4']")
*.car[5].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='5']")
*.car[6].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='6']")
*.car[7].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='7']")
*.car[8].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='8']")
*.car[9].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='9']")
*.car[10].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='10']")
*.car[11].mobility.turtleScript = xmldoc("konvoi${speed}.xml", "movements//movement[@id='11']")

# rekam paket yang DIKIRIM tiap kendaraan ke file .pcap (untuk hitung AODV)
*.car[*].recordPcap = true
*.car[*].pcapRecorder[0].receivingSignalNames = ""
*.car[*].pcapRecorder[0].fileFormat = "pcap"
*.car[*].pcapRecorder[0].pcapFile = "results/Konvoi-v${speed}-r${repetition}-car" + string(parentIndex()) + ".pcap"